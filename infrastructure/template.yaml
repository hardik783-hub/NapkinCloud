AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: NapkinCloud - First AWS Deployment

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10

Resources:

  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/create-order/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Events:
        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /orders
            Method: post

Outputs:

  ApiUrl:
    Description: Orders API endpoint
    Value: !Sub "https://${OrdersApi}.execute-api.${AWS::Region}.amazonaws.com/prod/orders"

  OrdersTableName:
    Description: DynamoDB table
    Value: !Ref OrdersTable

  CreateOrderFunction:
    Description: Lambda function
    Value: !Ref CreateOrderFunction